// RNDC Configuration - DNS Master
// Used by rndc command to control named

// Include the shared key
include "/etc/bind/rndc.key";

options {
    default-key "rndc-key";
    default-server 127.0.0.1;
    default-port 953;
};

// Local server control
server 127.0.0.1 {
    key "rndc-key";
};

// Allow control from web-manager container
server 172.20.0.20 {
    key "rndc-key";
};
